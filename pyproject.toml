[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-auditor"
version = "0.1.0"
description = "Automated SEO audits powered by Screaming Frog and Claude"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "anthropic>=0.39.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "pandas>=2.1.0",
    "Jinja2>=3.1.2",
    "click>=8.1.0",
    "rich>=13.6.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.9",
    "mypy>=1.5.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
seo-audit = "seo_auditor.main:cli"

[tool.setuptools.packages.find]
include = ["seo_auditor*"]
exclude = ["demo*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
